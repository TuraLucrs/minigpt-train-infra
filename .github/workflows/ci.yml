name: MiniGPT-Train CI

on:
  push:
    branches:
      - main
      - "upgrade/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-correctness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
          cache: pip

      - name: Install pinned correctness environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            torch==2.10.0 \
            numpy==2.5.3 \
            safetensors==0.8.0 \
            transformers==5.16.1

      - name: Compile Python sources
        run: python -m compileall -q src tests benchmarks

      - name: Run complete CPU and Gloo regression suite
        run: |
          set -euo pipefail
          for test_file in tests/test_*.py; do
            echo "Running ${test_file}"
            python "${test_file}"
          done
