name: Codex exact Git bundle sync

on:
  push:
    branches:
      - codex/exact-git-sync
    paths:
      - codex-sync/minigpt-train.bundle.sha256

permissions:
  contents: write

concurrency:
  group: codex-exact-git-sync
  cancel-in-progress: false

jobs:
  import-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out sync branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install             torch==2.10.0             numpy==2.5.3             safetensors==0.8.0             transformers==5.16.1

      - name: Verify, test, and import approved refs
        shell: bash
        run: |
          set -euo pipefail

          encoded_parts=(
            codex-sync/minigpt-train-v07.bundle.b64.part00
            codex-sync/minigpt-train-v07.bundle.b64.part01
            codex-sync/minigpt-train-v07.bundle.b64.part02
            codex-sync/minigpt-train-v07.bundle.b64.part03
          )
          bundle_path="$RUNNER_TEMP/minigpt-train.bundle"
          checksum_path="codex-sync/minigpt-train.bundle.sha256"

          for encoded_part in "${encoded_parts[@]}"; do
            if [[ ! -f "$encoded_part" ]]; then
              echo "Missing encoded bundle part: $encoded_part" >&2
              exit 1
            fi
          done
          cat "${encoded_parts[@]}" | base64 --decode > "$bundle_path"

          expected_sha256="$(tr -d '[:space:]' < "$checksum_path")"
          actual_sha256="$(sha256sum "$bundle_path" | awk '{print $1}')"

          if [[ ! "$expected_sha256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Invalid expected SHA-256" >&2
            exit 1
          fi
          if [[ "$actual_sha256" != "$expected_sha256" ]]; then
            echo "Bundle SHA-256 mismatch" >&2
            exit 1
          fi

          git bundle verify "$bundle_path"
          mapfile -t advertised_refs < <(git bundle list-heads "$bundle_path")
          if (( ${#advertised_refs[@]} == 0 || ${#advertised_refs[@]} > 32 )); then
            echo "Bundle must advertise between 1 and 32 refs" >&2
            exit 1
          fi

          index=0
          for advertised in "${advertised_refs[@]}"; do
            object_sha="${advertised%% *}"
            target_ref="${advertised#* }"

            if [[ ! "$object_sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Invalid object SHA: $object_sha" >&2
              exit 1
            fi
            case "$target_ref" in
              refs/heads/upgrade/v*|refs/tags/v*) ;;
              *)
                echo "Forbidden target ref: $target_ref" >&2
                exit 1
                ;;
            esac

            local_ref="refs/codex-import/${GITHUB_RUN_ID}/${index}"
            git fetch --no-tags "$bundle_path" "$target_ref:$local_ref"
            imported_sha="$(git rev-parse "$local_ref")"
            if [[ "$imported_sha" != "$object_sha" ]]; then
              echo "Imported object mismatch for $target_ref" >&2
              exit 1
            fi

            worktree_path="$RUNNER_TEMP/minigpt-train-${index}"
            git worktree add --detach "$worktree_path" "$local_ref"
            (
              cd "$worktree_path"
              python -m compileall -q src tests benchmarks
              git diff --check
              for test_file in tests/test_*.py; do
                python "$test_file"
              done
            )
            git worktree remove "$worktree_path"

            remote_line="$(git ls-remote --refs origin "$target_ref")"
            remote_sha="${remote_line%%$'\t'*}"
            if [[ -n "$remote_line" && "$remote_sha" == "$object_sha" ]]; then
              echo "Already synchronized: $target_ref"
            elif [[ -n "$remote_line" && "$target_ref" == refs/tags/* ]]; then
              echo "Refusing to replace existing tag: $target_ref" >&2
              exit 1
            else
              git push origin "$local_ref:$target_ref"
            fi

            index=$((index + 1))
          done

          echo "Tested and imported ${#advertised_refs[@]} verified refs from $actual_sha256"
