name: v0.9 backends profiler and matrix regression

on:
  push:
    branches:
      - upgrade/v0.9-backends-profiler-matrix
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v0.9-backends-profiler-matrix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cpu-and-gloo-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GLOO_SOCKET_IFNAME: lo
      MINIGPT_RUN_GLOO_TESTS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONUTF8: "1"
    steps:
      - name: Check out exact v0.9 commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned CPU dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.10.0"
          python -m pip install "numpy==2.5.3" "safetensors==0.8.0" "transformers==5.16.1"
          python -m pip install --no-deps -e .

      - name: Validate source and all hardware matrix presets
        shell: bash
        run: |
          set -euo pipefail
          test "$(python -c 'import importlib.metadata; print(importlib.metadata.version("minigpt-train"))')" = "0.9.0"
          git diff --check
          bash -n scripts/run_v08_decode_vocab_ab.sh
          python -m compileall -q src tests benchmarks scripts
          python - <<'PY'
          import ast
          import json
          from pathlib import Path
          from minigpt.experiment_matrix import expand_matrix, load_matrix_config

          for base in ("src", "tests", "benchmarks", "scripts"):
              for path in Path(base).rglob("*.py"):
                  ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
          for path in Path("configs").rglob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))
          for name in ("ascend_a3", "ascend_a5", "cuda", "cpu_correctness"):
              plan = expand_matrix(load_matrix_config(f"configs/v09_{name}.json"))
              assert plan["points"] and plan["cases"]
          PY

      - name: Preserve full historical CPU and Gloo regression
        shell: bash
        run: |
          set -euo pipefail
          python tests/test_core.py
          python tests/test_inference.py
          python tests/test_kv_cache.py
          python tests/test_qwen3.py
          python tests/test_qwen3_tp.py
          python tests/test_reference_parity.py
          python tests/test_resume_consistency.py
          python tests/test_tp_scaling.py
          python tests/test_continuous_batching.py
          python tests/test_serving_workloads.py
          python tests/test_profiling_gate.py
          python tests/test_mixed_repro.py
          python tests/test_decode_critical_path.py
          python tests/test_v08_runner.py

      - name: Exercise real portable profilers, CLIs and resumable matrix
        shell: bash
        run: |
          set -euo pipefail
          python tests/test_backends.py
          python tests/test_profiler_backends.py
          python tests/test_benchmark_portable.py
          python tests/test_backend_telemetry.py
          python tests/test_benchmark_entrypoints.py
          python tests/test_experiment_matrix.py
