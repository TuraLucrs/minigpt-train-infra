[project]
name = "minigpt-train"
version = "0.2.2"
description = "A reference-to-industrial MiniGPT training and inference infra learning project."
requires-python = ">=3.9"
dependencies = ["torch>=2.0", "numpy>=1.26"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
