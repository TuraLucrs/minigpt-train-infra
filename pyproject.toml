[project]
name = "minigpt-train"
version = "0.7.0.dev0"
description = "A reference-to-industrial MiniGPT training and inference infra learning project."
requires-python = ">=3.10"
dependencies = [
    "torch>=2.8",
    "numpy>=1.26",
    "safetensors>=0.5",
    "transformers>=4.51,<6",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
