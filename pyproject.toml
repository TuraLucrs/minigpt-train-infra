[project]
name = "minigpt-train"
version = "0.1.0"
description = "A heavily commented single-GPU MiniGPT pretraining project for AI infra learning."
requires-python = ">=3.9"
dependencies = ["torch>=2.0", "numpy>=1.26"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
